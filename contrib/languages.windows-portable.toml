[[language]]
name = "jsonc"
language-servers = ["vscode-json-language-server"]
auto-format = true
indent = { tab-width = 2, unit = "  " }
formatter = { command = "node", args = ["${env:LOCALAPPDATA}/helix/language-servers/web/node_modules/prettier/bin/prettier.cjs", "--stdin-filepath", "%{buffer_name}"] }

# CMake: neocmakelsp 0.10.2 locates Windows system modules through this prefix.
# Resolve the current user on each computer; this example uses Scoop CMake.
[language-server.neocmakelsp]
command = "neocmakelsp"
args = ["stdio"]
environment = { MSYSTEM_PREFIX = "${env:USERPROFILE}/scoop/apps/cmake/current" }

[[language]]
name = "cmake"
language-servers = ["neocmakelsp"]
